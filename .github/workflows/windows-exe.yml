name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable" tmp_templates
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tmp_templates
          mv tmp_templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Import project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Export Windows
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/AgartalaEyeOfTheStorm.exe
          test -s build/AgartalaEyeOfTheStorm.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Agartala-Windows-EXE
          path: build/AgartalaEyeOfTheStorm.exe
